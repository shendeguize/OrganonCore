name: Repository
on:
  pull_request:
  push:
    branches: [main, 'dev*', 'dev**/**', 'release*', 'release**/**', 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Repository / verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: product
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Read fixed shared-tool source
        id: tooling
        working-directory: product
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const t=JSON.parse(fs.readFileSync("release/tooling.json")); for(const k of ["workspace","core"]) if(t[k]) {if(!/^[a-f0-9]{40}$/.test(t[k].commit)) throw Error("Unpinned tools"); fs.appendFileSync(process.env.GITHUB_OUTPUT, k+"="+t[k].commit+"\n");}'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: shendeguize/AgentOrganon
          ref: ${{ steps.tooling.outputs.workspace }}
          path: tools
          persist-credentials: false
      - name: Install pinned Lean toolchain in temporary runner storage
        env:
          ELAN_HOME: ${{ runner.temp }}/organon-elan
        run: |
          mkdir -p "$RUNNER_TEMP/organon-elan-bootstrap"
          curl --proto '=https' --tlsv1.2 --fail --location https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz --output "$RUNNER_TEMP/organon-elan-bootstrap/elan.tar.gz"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $RUNNER_TEMP/organon-elan-bootstrap/elan.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/organon-elan-bootstrap/elan.tar.gz" -C "$RUNNER_TEMP/organon-elan-bootstrap"
          "$RUNNER_TEMP/organon-elan-bootstrap/elan-init" -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.1
          "$ELAN_HOME/bin/elan" toolchain install leanprover/lean4:v4.33.1
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - name: Source tests and human-document links
        working-directory: product
        env:
          ORGANON_WORKSPACE_ROOT: ${{ github.workspace }}/tools
          ORGANON_CORE_ROOT: ${{ github.workspace }}/product
        run: |
          npm test
          npm run check:content
      - name: Install locked site build dependencies
        working-directory: product/tools/site
        run: npm ci --ignore-scripts
      - name: Build and validate released-site paths
        working-directory: product
        env:
          ORGANON_CORE_ROOT: ${{ github.workspace }}/product
        run: npm run check:site
      - name: Check current Lean evidence and four reader editions
        run: node product/skills/organon-core-leanify-prove/scripts/check.js product/lean/philosophy --manuscript manuscript.json
      - name: Keep development site preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-site-OrganonCore-${{ github.run_attempt }}
          path: product/dist/site/
          if-no-files-found: error
